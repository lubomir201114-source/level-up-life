<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Level Up Life">
<meta name="theme-color" content="#0a0a14">
<title>Level Up Life</title>
<style>
:root{
  --bg:#0a0a14;--bg2:#12121f;--card:rgba(28,28,46,.85);--card2:rgba(20,20,40,.8);
  --line:rgba(110,110,255,.22);--text:#eef0ff;--muted:#8a94bc;
  --accent:#00c9ff;--primary:#6a11cb;--secondary:#2575fc;
  --gold:#ffd700;--success:#00c853;--danger:#ff3b5c;--warning:#ffab00;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);overflow-x:hidden;}
body{padding-bottom:72px;}

/* ── TOP HEADER ── */
#appHeader{
  position:sticky;top:0;z-index:50;
  background:rgba(10,10,20,.97);border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;gap:10px;
}
.app-brand{display:flex;align-items:center;gap:8px;}
.app-brand .logo{font-size:1.3rem;}
.app-brand .app-name{font-weight:800;font-size:1rem;background:linear-gradient(90deg,var(--accent),#92fe9d);-webkit-background-clip:text;background-clip:text;color:transparent;}
.header-right{display:flex;align-items:center;gap:8px;}
.coins-pill{background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.4);border-radius:20px;padding:6px 12px;font-weight:800;font-size:.9rem;color:var(--gold);display:flex;align-items:center;gap:5px;}
.level-pill{background:rgba(106,17,203,.25);border:1px solid rgba(120,80,255,.4);border-radius:20px;padding:6px 10px;font-size:.78rem;font-weight:700;color:#c4b5ff;}

/* ── BOTTOM NAV ── */
#bottomNav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(8,9,18,.98);border-top:1px solid var(--line);
  backdrop-filter:blur(16px);
  display:flex;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 2px 10px;background:none;border:none;color:var(--muted);
  font-size:.58rem;font-weight:700;letter-spacing:.3px;cursor:pointer;gap:3px;
  transition:color .2s;
}
.nav-btn .ni{font-size:1.35rem;transition:transform .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active .ni{transform:scale(1.2);}

/* ── CONTENT ── */
.content{max-width:540px;margin:0 auto;padding:14px 14px 10px;}

/* ── CARDS / SECTIONS ── */
.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px);}
.section-title{font-size:1.15rem;font-weight:800;color:var(--accent);margin-bottom:4px;}
.section-sub{font-size:.8rem;color:var(--muted);margin-bottom:14px;line-height:1.45;}
.divider{width:40px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--secondary));margin:6px 0 14px;}

/* ── HINT CARD ── */
.hint{background:rgba(0,201,255,.07);border:1px solid rgba(0,201,255,.18);border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:.82rem;color:var(--muted);line-height:1.5;}
.hint strong{color:var(--accent);}

/* ── STREAK HERO ── */
.streak-hero{background:linear-gradient(135deg,rgba(255,140,0,.18),rgba(255,0,80,.14));border:1px solid rgba(255,140,0,.35);border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px;}
.sh-fire{font-size:2.8rem;margin-bottom:6px;}
.sh-num{font-size:3.5rem;font-weight:900;background:linear-gradient(90deg,#ff8a00,#ff0080);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
.sh-label{font-size:.95rem;color:var(--muted);margin-top:4px;}
.sh-sub{font-size:.8rem;color:var(--warning);margin-top:8px;font-weight:600;}

/* ── TODAY PROGRESS ── */
.today-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;}
.tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tc-label{font-size:.85rem;color:var(--muted);font-weight:600;}
.tc-num{font-size:1.6rem;font-weight:900;color:var(--text);}
.tc-num span{font-size:1rem;color:var(--muted);font-weight:500;}
.tc-bar{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:8px;}
.tc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:6px;transition:width .4s;}
.tc-cta{font-size:.8rem;color:var(--muted);text-align:center;}

/* ── COACH ── */
.coach{background:linear-gradient(135deg,rgba(106,17,203,.28),rgba(37,117,252,.16));border:1px solid rgba(120,150,255,.35);}
.coach-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.coach-av{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7b5bff,#2575fc);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;animation:coachPulse 2.6s infinite;flex-shrink:0;}
@keyframes coachPulse{0%,100%{box-shadow:0 0 12px rgba(91,140,255,.4);}50%{box-shadow:0 0 24px rgba(91,140,255,.8);}}
.coach-name{font-weight:800;font-size:1rem;color:#cfe0ff;}
.coach-name small{display:block;font-weight:500;font-size:.7rem;color:var(--muted);}
.coach-bubble{background:rgba(10,12,26,.7);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.92rem;line-height:1.55;min-height:52px;margin-bottom:10px;}
.coach-btns{display:flex;gap:8px;flex-wrap:wrap;}
.coach-btns button{flex:1;min-width:100px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 6px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.2s;}
.coach-btns button:hover{background:var(--secondary);}

/* ── SCHEDULE ── */
.sched{display:flex;flex-direction:column;gap:7px;}
.schedrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:10px;padding:9px 12px;}
.schedrow.active{border-color:var(--success);background:rgba(0,200,83,.09);}
.schedrow.past{opacity:.38;}
.sched-time{font-size:.72rem;color:var(--accent);font-weight:700;min-width:82px;}
.sched-block{flex:1;font-size:.82rem;color:var(--text);}
.sched-icon{font-size:1.1rem;}
.now-badge{background:var(--success);color:#021a0a;font-size:.6rem;font-weight:800;padding:2px 5px;border-radius:5px;margin-left:4px;}

/* ── QUESTS ── */
.quests{display:flex;flex-direction:column;gap:10px;}
.quest{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;transition:.2s;}
.quest.done{opacity:.5;}
.quest .qt{font-size:.97rem;color:var(--text);font-weight:700;margin-bottom:4px;padding-right:26px;}
.quest .qd{font-size:.78rem;color:var(--muted);margin-bottom:4px;}
.quest .qr{font-size:.78rem;color:var(--success);font-weight:700;margin-bottom:10px;}
.qbtn{width:100%;border:none;border-radius:10px;padding:11px;font-weight:800;cursor:pointer;font-size:.88rem;background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;transition:.2s;}
.qbtn.done{background:var(--success);cursor:default;}
.xdel{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;}
.xdel:hover{color:var(--danger);}
.empty-state{text-align:center;padding:24px 16px;color:var(--muted);}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:8px;}
.empty-state .es-title{font-weight:700;color:var(--text);margin-bottom:6px;font-size:.95rem;}
.empty-state .es-text{font-size:.82rem;line-height:1.5;}

/* ── ADD ROW ── */
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.addrow input{flex:1;min-width:130px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:.88rem;outline:none;}
.addrow input:focus{border-color:var(--accent);}
.addrow select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 8px;font-size:.85rem;outline:none;cursor:pointer;}
.addbtn{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;border:none;font-weight:800;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:.88rem;white-space:nowrap;}

/* ── LEVEL BAR ── */
.level-display{text-align:center;margin-bottom:16px;}
.level-num{font-size:2.6rem;font-weight:900;background:linear-gradient(90deg,#ff8a00,#ff0080);-webkit-background-clip:text;background-clip:text;color:transparent;}
.lvbar{height:14px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin:8px 0 4px;}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a00,#ff0080);border-radius:8px;transition:width .5s;}
.lvtext{font-size:.78rem;color:var(--muted);}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stat-card .si{font-size:1.6rem;margin-bottom:6px;}
.stat-card .sn{font-size:.8rem;color:var(--accent);margin-bottom:4px;font-weight:600;}
.stat-card .sv{font-size:1.2rem;font-weight:800;margin-bottom:8px;}
.sbar{height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;}
.sbar i{display:block;height:100%;border-radius:5px;}
.s-strength .sbar i{background:linear-gradient(90deg,#ff416c,#ff4b2b);}
.s-agility .sbar i{background:linear-gradient(90deg,#56ab2f,#a8e063);}
.s-perception .sbar i{background:linear-gradient(90deg,#2193b0,#6dd5ed);}
.s-stamina .sbar i{background:linear-gradient(90deg,#834d9b,#d04ed6);}
.s-intelligence .sbar i{background:linear-gradient(90deg,#00c9ff,#92fe9d);}

/* ── ACHIEVEMENTS ── */
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ach{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;position:relative;}
.ach.locked{filter:grayscale(1) brightness(.45);}
.ach .ai{font-size:2rem;margin-bottom:6px;}
.ach .at{color:var(--accent);font-size:.85rem;font-weight:700;margin-bottom:4px;}
.ach .ad{color:var(--muted);font-size:.72rem;}
.ach-badge{position:absolute;top:8px;right:8px;padding:2px 6px;border-radius:8px;font-size:.62rem;font-weight:800;}
.ach-badge.locked{background:rgba(0,0,0,.6);color:var(--warning);}
.ach-badge.unlocked{background:var(--success);color:#021a0a;}

/* ── BUSINESS ── */
.revenue-hero{text-align:center;padding:18px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:16px;margin-bottom:12px;}
.rh-amount{font-size:2.4rem;font-weight:900;color:var(--gold);}
.rh-label{font-size:.8rem;color:var(--muted);margin-top:4px;}
.biz-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.bizcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
.bizcard .bv{font-size:1.8rem;font-weight:900;color:var(--accent);}
.bizcard .bl{font-size:.68rem;color:var(--muted);margin:3px 0 8px;line-height:1.3;}
.bizcard .badd{width:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;border:none;border-radius:8px;padding:8px 4px;font-size:.72rem;font-weight:700;cursor:pointer;}
.rev-row{display:flex;gap:8px;margin-bottom:14px;}
.rev-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,0,.3);color:var(--text);border-radius:10px;padding:10px 12px;font-size:.88rem;outline:none;}
.rev-row input:focus{border-color:var(--gold);}
.rev-row button{background:linear-gradient(90deg,#ff8a00,#ff4b2b);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:.82rem;white-space:nowrap;}

/* ── BOSSES ── */
.bosses{display:flex;flex-direction:column;gap:10px;}
.boss{background:rgba(255,255,255,.04);border:2px solid rgba(255,59,92,.3);border-radius:16px;padding:16px;position:relative;}
.boss.defeated{border-color:rgba(0,200,83,.4);background:rgba(0,200,83,.05);}
.boss.ready{border-color:var(--gold);animation:bGlow 2s infinite;}
@keyframes bGlow{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.2);}50%{box-shadow:0 0 20px rgba(255,215,0,.6);}}
.boss-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.boss-icon{font-size:2rem;flex-shrink:0;}
.boss-info{flex:1;}
.boss-name{font-weight:800;font-size:.95rem;color:var(--danger);margin-bottom:2px;}
.boss.defeated .boss-name{color:var(--success);}
.boss.ready .boss-name{color:var(--gold);}
.boss-desc{font-size:.78rem;color:var(--muted);line-height:1.4;}
.boss-reward{font-size:.75rem;color:var(--warning);font-weight:600;margin-bottom:10px;}
.boss-prog{font-size:.75rem;color:var(--muted);margin-bottom:8px;}
.boss-beat-badge{position:absolute;top:12px;right:12px;background:var(--success);color:#021a0a;padding:3px 8px;border-radius:8px;font-size:.65rem;font-weight:800;}
.boss-btn{width:100%;border:none;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;font-size:.85rem;background:linear-gradient(90deg,#ff8a00,#ff0080);color:#fff;}
.boss-btn.manual{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);font-weight:600;}

/* ── SHOP ── */
.coins-hero{text-align:center;padding:18px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:16px;margin-bottom:12px;}
.ch-num{font-size:2.6rem;font-weight:900;color:var(--gold);}
.ch-label{font-size:.8rem;color:var(--muted);margin-top:4px;}
.rewards-grid{display:flex;flex-direction:column;gap:10px;}
.reward-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,215,0,.3);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;position:relative;}
.reward-card .ri{font-size:1.6rem;flex-shrink:0;}
.reward-card .rinfo{flex:1;}
.reward-card .rname{font-weight:700;font-size:.9rem;margin-bottom:3px;}
.reward-card .rprice{color:var(--gold);font-weight:800;font-size:.85rem;}
.reward-card .rbuy{background:linear-gradient(90deg,#ff8a00,#ff4b2b);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.82rem;flex-shrink:0;}

/* ── PROFILE ── */
.profile-hero{text-align:center;padding:20px 16px;margin-bottom:14px;}
.ph-av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px;box-shadow:0 0 20px rgba(106,17,203,.5);}
.ph-name{font-size:1.3rem;font-weight:800;margin-bottom:4px;}
.ph-edit{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.75rem;cursor:pointer;margin-top:4px;}
.ph-edit:hover{color:var(--text);border-color:var(--muted);}

/* ── JOURNEY ── */
.journey{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.jcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.jv{font-size:1.4rem;font-weight:800;color:var(--accent);}
.jl{color:var(--muted);font-size:.72rem;margin-top:4px;line-height:1.3;}

/* ── LOG ── */
.log{display:flex;flex-direction:column;gap:7px;max-height:220px;overflow-y:auto;}
.logitem{background:rgba(255,255,255,.04);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;font-size:.8rem;display:flex;justify-content:space-between;gap:8px;}
.logitem .lt{color:var(--muted);font-size:.7rem;white-space:nowrap;}

/* ── SETTINGS ── */
.settings-row{display:flex;flex-direction:column;gap:8px;}
.settings-row label{font-size:.8rem;color:var(--muted);font-weight:600;}
.settings-row select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:.88rem;outline:none;cursor:pointer;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.btn-outline{flex:1;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px 8px;font-size:.82rem;cursor:pointer;text-align:center;}
.btn-outline:hover{color:var(--text);border-color:var(--muted);}

/* ── NOTIFICATIONS ── */
#notifs{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:420px;}
.notif{background:rgba(18,18,30,.97);border-radius:10px;padding:12px 15px;border-left:4px solid var(--accent);font-size:.88rem;animation:slideDown .3s ease,fadeUp .4s ease 3s forwards;backdrop-filter:blur(8px);}
.notif.success{border-left-color:var(--success);}
.notif.danger{border-left-color:var(--danger);}
.notif.gold{border-left-color:var(--gold);}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
@keyframes fadeUp{to{opacity:0;transform:translateY(-10px);}}

/* ── FLOAT ANIMATIONS ── */
.float-text{position:fixed;font-size:1.5rem;font-weight:900;pointer-events:none;z-index:500;transform:translateX(-50%);animation:ftFloat 1.4s ease-out forwards;}
@keyframes ftFloat{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}30%{opacity:1;transform:translateX(-50%) translateY(-30px) scale(1.3);}100%{opacity:0;transform:translateX(-50%) translateY(-120px) scale(.8);}}
.screen-flash{position:fixed;inset:0;pointer-events:none;z-index:400;background:rgba(255,215,0,1);opacity:.07;animation:sfFade .5s ease-out forwards;}
@keyframes sfFade{from{opacity:.07;}to{opacity:0;}}
@keyframes questBounce{0%{transform:scale(1);}30%{transform:scale(1.04);}60%{transform:scale(.97);}100%{transform:scale(1);}}
.quest-bounce{animation:questBounce .35s ease;}

/* ── ONBOARDING ── */
#onboarding{position:fixed;inset:0;z-index:1000;background:#05050f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
.ob-fire{font-size:4rem;animation:obPulse 1.5s infinite;}
@keyframes obPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.ob-title{font-size:2.1rem;font-weight:900;background:linear-gradient(90deg,#ffd700,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0 8px;line-height:1.15;}
.ob-sub{font-size:1rem;color:var(--muted);line-height:1.6;margin-bottom:24px;max-width:300px;}
.ob-date{font-size:.9rem;color:var(--warning);font-weight:700;margin-bottom:32px;padding:10px 20px;border:1px solid rgba(255,171,0,.4);border-radius:12px;}
.ob-btn{background:linear-gradient(90deg,#ffd700,#ff8a00);color:#0a0a00;border:none;border-radius:16px;padding:18px 40px;font-size:1.2rem;font-weight:900;cursor:pointer;box-shadow:0 0 30px rgba(255,215,0,.4);transition:transform .2s;}
.ob-btn:hover{transform:scale(1.04);}

/* ── DAILY SUMMARY ── */
#dailySummary{position:fixed;inset:0;z-index:900;background:rgba(5,5,15,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;backdrop-filter:blur(10px);}
.ds-icon{font-size:3.5rem;margin-bottom:10px;}
.ds-title{font-size:1.6rem;font-weight:900;color:var(--gold);margin-bottom:6px;}
.ds-date{font-size:.82rem;color:var(--muted);margin-bottom:20px;}
.ds-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:300px;margin-bottom:20px;}
.ds-stat{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;}
.ds-stat .dsv{font-size:1.6rem;font-weight:900;color:var(--accent);}
.ds-stat .dsl{font-size:.72rem;color:var(--muted);margin-top:4px;}
.ds-msg{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:24px;max-width:280px;line-height:1.5;}
.ds-close{background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;border:none;border-radius:14px;padding:15px 36px;font-size:1rem;font-weight:800;cursor:pointer;}
.confetti-piece{position:fixed;width:8px;height:8px;top:-10px;border-radius:2px;animation:cFall linear forwards;z-index:1002;pointer-events:none;}
@keyframes cFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ── BIKE BAR ── */
.bike-bar-wrap{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:16px;padding:16px;margin-bottom:12px;}
.bike-bar-title{font-size:.9rem;font-weight:800;color:var(--gold);margin-bottom:10px;}
.bike-bar-track{height:14px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin-bottom:8px;position:relative;}
.bike-bar-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff8a00);border-radius:8px;transition:width .6s ease;position:relative;min-width:0;}
.bike-bar-glow{position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:#ffd700;border-radius:50%;box-shadow:0 0 10px #ffd700,0 0 20px rgba(255,215,0,.6);}
.bike-bar-info{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);}
.bike-bar-milestone{font-size:.78rem;color:var(--warning);font-weight:700;margin-top:6px;padding:5px 10px;background:rgba(255,171,0,.1);border-radius:8px;text-align:center;}

/* ── MUTE BTN ── */
.mute-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:1rem;cursor:pointer;color:var(--text);line-height:1;}
.mute-btn:hover{border-color:var(--muted);}
</style>

function t(key,vars){
  let s=(LANG[state.lang]&&LANG[state.lang][key])||LANG.en[key]||key;
  if(vars) for(const k in vars) s=s.replace('{'+k+'}',vars[k]);
  return s;
}

/* ── STATE ── */
let state=load();
let currentTab='home';

/* ── UPGRADE: sound + session vars ── */
let sessionXP=0,sessionCoins=0;
let soundEnabled=localStorage.getItem('soundMuted')!=='1';
let audioCtx=null;
function getAC(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}return audioCtx;}
function playSound(type){
  if(!soundEnabled)return;const ac=getAC();if(!ac)return;const now=ac.currentTime;
  if(type==='quest'){[523,659,784].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.28,now+i*.08);g.gain.exponentialRampToValueAtTime(.001,now+i*.08+.35);o.connect(g);g.connect(ac.destination);o.start(now+i*.08);o.stop(now+i*.08+.35);});}
  else if(type==='levelup'){[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.18,now+i*.18);g.gain.exponentialRampToValueAtTime(.001,now+i*.18+.45);o.connect(g);g.connect(ac.destination);o.start(now+i*.18);o.stop(now+i*.18+.45);});}
  else if(type==='buy'){[880,1100,1320,1760].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.22,now+i*.06);g.gain.exponentialRampToValueAtTime(.001,now+i*.06+.18);o.connect(g);g.connect(ac.destination);o.start(now+i*.06);o.stop(now+i*.06+.18);});}
  else if(type==='streak'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(80,now);o.frequency.exponentialRampToValueAtTime(40,now+.6);g.gain.setValueAtTime(.5,now);g.gain.exponentialRampToValueAtTime(.001,now+.6);o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+.6);}
}
function toggleMute(){soundEnabled=!soundEnabled;localStorage.setItem('soundMuted',soundEnabled?'0':'1');const btn=document.getElementById('muteBtn');if(btn)btn.textContent=soundEnabled?'🔊':'🔇';}

/* ── UPGRADE: float text + screen flash ── */
function floatUp(text,x,y,color){const el=document.createElement('div');el.className='float-text';el.textContent=text;el.style.cssText='left:'+x+'px;top:'+y+'px;color:'+color+';';document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
function screenFlash(){const el=document.createElement('div');el.className='screen-flash';document.body.appendChild(el);setTimeout(()=>el.remove(),600);}

/* ── UPGRADE: onboarding ── */
function showOnboarding(){
  const ob=document.createElement('div');ob.id='onboarding';
  const daysLeft=Math.max(0,Math.ceil((new Date('2026-07-01')-new Date())/(864e5)));
  ob.innerHTML='<div class="ob-fire">🔥</div><div class="ob-title">LOCK IN<br>SUMMER 2026</div><div class="ob-sub">Любомире, це твоє літо.<br>62 дні. Один вибір.</div><div class="ob-date">⏳ Старт: 1 липня 2026'+(daysLeft>0?' · ще '+daysLeft+' дн.':' · СЬОГОДНІ!')+'</div><button class="ob-btn" onclick="closeOnboarding()">ПОЧАТИ ГРУ ⚔️</button>';
  document.body.appendChild(ob);
}
function closeOnboarding(){localStorage.setItem('onboardingDone','1');const ob=document.getElementById('onboarding');if(ob){ob.style.opacity='0';ob.style.transition='opacity .5s';setTimeout(()=>{ob.remove();render();},500);}}

/* ── UPGRADE: confetti + daily summary ── */
function launchConfetti(){const cols=['#ffd700','#ff8a00','#00c9ff','#ff3b5c','#00c853','#92fe9d'];for(let i=0;i<60;i++)setTimeout(()=>{const c=document.createElement('div');c.className='confetti-piece';c.style.left=Math.random()*100+'vw';c.style.background=cols[Math.floor(Math.random()*cols.length)];c.style.animationDuration=(1.5+Math.random()*2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000);},i*30);}
function showDailySummary(){
  const st=streak();
  const msg=st>=14?'ЛЕГЕНДА ⚡':st>=7?'Ти в зоні 🔥':st>=3?'На вірному шляху 🚀':'Добрий початок 💪';
  const dateStr=new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'long'});
  const el=document.createElement('div');el.id='dailySummary';
  el.innerHTML='<div class="ds-icon">🏆</div><div class="ds-title">День завершено!</div><div class="ds-date">'+dateStr+'</div>'
    +'<div class="ds-stats"><div class="ds-stat"><div class="dsv">+'+sessionXP+'</div><div class="dsl">XP сьогодні</div></div>'
    +'<div class="ds-stat"><div class="dsv">+'+sessionCoins+'</div><div class="dsl">Монет</div></div>'
    +'<div class="ds-stat"><div class="dsv">'+state.quests.length+'</div><div class="dsl">Квести</div></div>'
    +'<div class="ds-stat"><div class="dsv">'+st+'</div><div class="dsl">Серія 🔥</div></div></div>'
    +'<div class="ds-msg">'+msg+'</div>'
    +'<button class="ds-close" onclick="closeDailySummary()">Продовжити 🗡️</button>';
  document.body.appendChild(el);launchConfetti();playSound('streak');
}
function closeDailySummary(){const el=document.getElementById('dailySummary');if(el){el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400);}}

/* ── UPGRADE: bike celebration ── */
function showBikeCelebration(){

function normalize(){
  const b=blank();
  for(const k in b){if(state[k]===undefined)state[k]=b[k];}
  if(!state.startDate)state.startDate=today();
  ['bestStreak','totalQuestsDone','totalCoinsEarned'].forEach(k=>{if(typeof state[k]!=='number')state[k]=0;});
  if(!state.activeDays)state.activeDays={};
  if(!state.stats)state.stats=b.stats;
  if(!state.businessStats)state.businessStats={demos:0,clients:0,calls:0,revenue:0};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ── DATES ── */
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return fmt(new Date());}
function dailyReset(){
  if(state.lastResetDate!==today()){
    state.quests.forEach(q=>q.doneToday=false);
    state.lastResetDate=today();save();
  }
}
function streak(){
  let c=0,d=new Date();
  const has=x=>state.allDoneDates[fmt(x)];
  if(!has(d))d.setDate(d.getDate()-1);
  while(has(d)){c++;d.setDate(d.getDate()-1);}
  return c;
}
function lockInDay(){
  const start=new Date('2026-07-01'),now=new Date();
  const diff=Math.floor((now-start)/(864e5))+1;
  return diff<1?0:Math.min(diff,62);
}
function currentScheduleIdx(){
  const now=new Date(),h=now.getHours(),m=now.getMinutes(),mins=h*60+m;
  for(let i=0;i<SCHEDULE.length;i++){
    const s=SCHEDULE[i];
    if(mins>=s.h*60+s.m&&mins<=s.end*60+s.em)return i;
  }
  return -1;
}

/* ── GAME LOGIC ── */
function xpNeed(L){return 100+(L-1)*40;}
function addXP(amount){
  state.xp+=amount;let need=xpNeed(state.level);
  while(state.xp>=need){state.xp-=need;state.level++;notify(t('n_levelup',{n:state.level}),'success');playSound('levelup');addLog('🎉 '+t('n_levelup',{n:state.level}));need=xpNeed(state.level);}
}
function completeQuest(id,ev){
  const q=state.quests.find(x=>x.id===id);if(!q||q.doneToday)return;
  if(ev){
    const btn=ev.target;const rect=btn.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top;
    floatUp('+'+q.xp+' XP ⚡',cx,cy,'#ffd700');
    setTimeout(()=>floatUp('+'+q.coins+' 🪙',cx+20,cy+10,'#00c9ff'),200);
    screenFlash();
    const card=btn.closest('.quest');
    if(card){card.classList.add('quest-bounce');setTimeout(()=>card.classList.remove('quest-bounce'),400);}
    playSound('quest');
  }
  q.doneToday=true;q.lastDone=today();
  addXP(q.xp);state.coins+=q.coins;
  sessionXP+=q.xp;sessionCoins+=q.coins;
  state.stats[q.stat]=Math.min(500,(state.stats[q.stat]||0)+q.gain);
  state.totalQuestsDone=(state.totalQuestsDone||0)+1;
  state.totalCoinsEarned=(state.totalCoinsEarned||0)+q.coins;
  state.activeDays[today()]=true;
  notify(t('n_quest',{xp:q.xp,coins:q.coins}),'success');
  addLog('✅ '+esc(q.name)+'  (+'+q.xp+' XP, +'+q.coins+' L)');
  const allDone=state.quests.length>0&&state.quests.every(x=>x.doneToday);
  if(allDone&&!state.allDoneDates[today()]){
    state.allDoneDates[today()]=true;notify(t('n_allDone'),'success');addLog('🔥 '+t('n_allDone'));
  }
  const s=streak();if(s>(state.bestStreak||0))state.bestStreak=s;
  save();render();
  if(allDone&&state.summaryShownDate!==today()){
    state.summaryShownDate=today();save();
    setTimeout(()=>showDailySummary(),1200);
  }
}
function addQuest(){
  const name=document.getElementById('qName').value.trim();if(!name)return;
  const stat=document.getElementById('qStat').value,diff=document.getElementById('qDiff').value,r=DIFF[diff];
  state.quests.push({id:uid(),name,stat,xp:r.xp,gain:r.gain,coins:r.coins,doneToday:false,lastDone:''});
  notify(t('n_questAdded'),'success');save();render();
}
function delQuest(id){state.quests=state.quests.filter(x=>x.id!==id);save();render();}
function addReward(){
  const name=document.getElementById('rName').value.trim();
  let cost=parseInt(document.getElementById('rCost').value,10);
  if(!name)return;if(isNaN(cost)||cost<0)cost=10;
  state.rewards.push({id:uid(),name,cost});notify(t('n_rewardAdded'),'success');save();render();
}
function buyReward(id){
  const r=state.rewards.find(x=>x.id===id);if(!r)return;
  if(state.coins>=r.cost){state.coins-=r.cost;notify(t('n_bought'),'success');playSound('buy');addLog('🎁 '+esc(r.name)+'  (-'+r.cost+' L)');save();render();}
  else notify(t('n_notEnough'),'danger');
}
function delReward(id){state.rewards=state.rewards.filter(x=>x.id!==id);save();render();}
function addLog(text){
  state.log.unshift({text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  state.log=state.log.slice(0,30);
}

/* ── BUSINESS ── */
function logBiz(type){
  const bs=state.businessStats;
  if(type==='demos'){bs.demos++;addXP(25);state.coins+=20;notify(t('n_demo',{xp:25}),'success');addLog('🎯 Демо #'+bs.demos);}
  else if(type==='clients'){bs.clients++;addXP(100);state.coins+=100;notify(t('n_client',{xp:100,coins:100}),'gold');addLog('💰 КЛІЄНТ #'+bs.clients+' — BEAST! 🔥');}
  else if(type==='calls'){bs.calls+=25;addXP(10);state.coins+=5;notify(t('n_calls',{xp:10}),'success');addLog('📞 +25 дзвінків (всього: '+bs.calls+')');}
  checkBosses();save();render();
}
function logRevenue(){
  const inp=document.getElementById('revInput');if(!inp)return;
  const amt=parseFloat(inp.value);
  if(isNaN(amt)||amt<=0){notify('Введи суму!','danger');return;}
  state.businessStats.revenue=(state.businessStats.revenue||0)+amt;
  if(state.businessStats.revenue>=5000&&!state.bikeCelebrated)setTimeout(()=>showBikeCelebration(),500);
  notify(t('n_revenue',{amount:amt.toLocaleString()}),'gold');
  addLog('💸 +$'+amt.toLocaleString()+' (всього: $'+state.businessStats.revenue.toLocaleString()+')');
  inp.value='';save();render();
}
function checkBosses(){
  const bs=state.businessStats;
  BOSSES.forEach(b=>{
    if((state.bossesDefeated||[]).includes(b.key))return;
    if(b.trigger==='demos'&&bs.demos>=b.val)defeatBoss(b.key,false);
    if(b.trigger==='clients'&&bs.clients>=b.val)defeatBoss(b.key,false);
  });
}
function defeatBoss(key,doRender){
  if((state.bossesDefeated||[]).includes(key))return;
  state.bossesDefeated.push(key);
  const b=BOSSES.find(x=>x.key===key);if(!b)return;
  addXP(50);state.coins+=50;
  notify(t('n_boss',{name:t(key+'_name')}),'gold');
  addLog('🏆 БОС: '+t(key+'_name'));
  if(doRender){save();render();}
}

function coachSuggestion(){
  const st=streak();
  const bs=state.businessStats||{demos:0,clients:0};
  const cheapest=state.rewards.length?Math.min.apply(null,state.rewards.map(r=>r.cost)):30;
  if(bs.clients>=3)return t('cSugClient',{clients:bs.clients});
  if(bs.clients>0)return t('cSugClient',{clients:bs.clients});
  if(bs.demos>0&&bs.clients===0)return t('cSugDemo',{demos:bs.demos});
  if(bs.demos===0)return t('cSugBiz');
  if(state.rewards.length&&state.coins>=cheapest)return t('cSugCoins',{coins:state.coins});
  if(st>0)return t('cSugStreak',{n:st});
  return t('cSugLow',{stat:t(lowestStat())});
}

  if(kind==='motivate'){
    const a=[t('cMot1',{name}),t('cMot2',{name}),t('cMot3',{name}),t('cMot4',{name}),t('cMot5',{name})];
    msg=a[Math.floor(Math.random()*a.length)];
  }else if(kind==='status'){
    msg=t('cStat',{lvl:state.level,total:state.totalQuestsDone||0,best:state.bestStreak||0,name});

  `;
}

function renderBusiness(){
  const bs=state.businessStats||{demos:0,clients:0,calls:0,revenue:0};
  return`
    <div class="section-title" style="margin-bottom:4px;">${t('bizTitle')}</div>
    <div class="section-sub">${t('bizSub')}</div>
    <div class="hint">${t('hintBiz')}</div>

    <div class="revenue-hero">
      <div class="rh-amount">$${(bs.revenue||0).toLocaleString()}</div>
      <div class="rh-label">Загальний дохід цього літа 💸</div>
    </div>

    ${(()=>{
      const rev=bs.revenue||0,goal=5000,pct=Math.min(100,rev/goal*100);
      const pctStr=pct.toFixed(1);
      let ms='';
      if(rev>=5000)ms='100% — БАЙК ТВІЙ! 🏍️⚡';
      else if(rev>=2500)ms='50% — Половина шляху 🔥';
      else if(rev>=1000)ms='20% — Реінвест у вебсайт ✅';
      return`<div class="bike-bar-wrap">
        <div class="bike-bar-title">🏍️ Talaria / Surron — ціль $5,000</div>
        <div class="bike-bar-track">
          <div class="bike-bar-fill" style="width:${pctStr}%">${pct>3?'<div class="bike-bar-glow"></div>':''}</div>
        </div>
        <div class="bike-bar-info"><span>$${rev.toLocaleString()} зароблено</span><span>${pctStr}% · ще $${Math.max(0,goal-rev).toLocaleString()}</span></div>
        ${ms?`<div class="bike-bar-milestone">${ms}</div>`:''}
      </div>`;
    })()}

    <div class="biz-cards">
      <div class="bizcard">
        <div class="bv">${bs.demos}</div>
        <div class="bl">${t('bizDemos')}</div>
        <button class="badd" onclick="logBiz('demos')">${t('bizAddDemo')}</button>
      </div>
      <div class="bizcard">
        <div class="bv">${bs.clients}</div>
        <div class="bl">${t('bizClients')}</div>
        <button class="badd" onclick="logBiz('clients')">${t('bizAddClient')}</button>
      </div>
      <div class="bizcard">
        <div class="bv">${bs.calls}</div>
        <div class="bl">${t('bizCalls')}</div>
        <button class="badd" onclick="logBiz('calls')">${t('bizAddCalls')}</button>
      </div>
    </div>

    <div class="section" style="margin-bottom:14px;">
      <div class="section-title">Записати дохід 💸</div>
      <div class="section-sub">Закрив клієнта? Введи суму яку отримав і натисни кнопку.</div>
      <div class="rev-row">
        <input type="number" id="revInput" placeholder="${t('bizRevInput')}" min="0">
        <button onclick="logRevenue()">${t('bizAddRevenue')}</button>
      </div>
    </div>

    <div class="section-title" style="margin-bottom:4px;">${t('bossTitle')}</div>
    <div class="section-sub">${t('bossSub')}</div>
    <div class="hint">${t('hintBoss')}</div>
    <div class="bosses">
      ${BOSSES.map(bossCardH).join('')}
    </div>
  `;
}

function renderShop(){
  return`
    <div class="section-title" style="margin-bottom:4px;">${t('rewardsShop')}</div>
    <div class="section-sub">${t('shopSub')}</div>
    <div class="hint">${t('hintShop')}</div>

    <div class="coins-hero">
      <div class="ch-num">🪙 ${state.coins}</div>
      <div class="ch-label">Твій баланс монет</div>
    </div>

    <div class="rewards-grid">
      ${state.rewards.length?state.rewards.map(r=>`
        <div class="reward-card">
          <button class="xdel" onclick="delReward('${r.id}')" style="position:absolute;top:10px;right:10px;">×</button>
          <div class="ri">🎁</div>
          <div class="rinfo">
            <div class="rname">${esc(r.name)}</div>
            <div class="rprice">🪙 ${r.cost} монет</div>
          </div>
          <button class="rbuy" onclick="buyReward('${r.id}')" ${state.coins<r.cost?'style="opacity:.4;cursor:not-allowed;"':''}>${state.coins>=r.cost?t('buy'):'🔒'}</button>
        </div>`).join(''):`
        <div class="empty-state">
          <div class="es-icon">🎁</div>
          <div class="es-title">Нагород ще немає</div>
          <div class="es-text">Додай реальні нагороди для себе нижче.<br>Наприклад: 1 год ігор = 30 монет.</div>
        </div>`}
    </div>

    <div class="section" style="margin-top:14px;">
      <div class="section-title">Додати нагороду</div>
      <div class="section-sub">Напиши назву нагороди і скільки монет вона коштує</div>
      <div class="addrow">
        <input type="text" id="rName" placeholder="${t('rewardPlaceholder')}">
        <input type="number" id="rCost" placeholder="${t('cost')} (монет)" min="0" style="max-width:130px;flex:0 0 130px;">
        <button class="addbtn" onclick="addReward()">+ ${t('add')}</button>
      </div>
    </div>
  `;
}

function renderProfile(){
  const need=xpNeed(state.level),xpPct=Math.min(100,state.xp/need*100);
  const lockDay=lockInDay();
  return`
    <div class="profile-hero">
      <div class="ph-av">⚽</div>
      <div class="ph-name">${esc(state.name||t('friend'))}</div>
      <div style="color:var(--muted);font-size:.8rem;margin-top:2px;">AI Receptionist Agency · Footballer</div>
      <button class="ph-edit" onclick="setName()">✏️ ${t('setName')}</button>
    </div>

    <section class="section">
      <div class="section-title">${t('level')} ${state.level}</div>
      <div class="section-sub">${t('xpProgress',{cur:state.xp,need:need})}</div>
      <div class="lvbar"><i style="width:${xpPct}%"></i></div>
    </section>

    <section class="section">
      <div class="section-title">${t('levelStats')}</div>
      <div class="section-sub">${t('hintStats')}</div>
      <div class="stats-grid">${STATS.map(statCardH).join('')}</div>
    </section>

    <section class="section">
      <div class="section-title">${t('journeyTitle')}</div>
      <div class="journey">
        <div class="jcard"><div class="jv">${state.startDate||today()}</div><div class="jl">${t('jSince')}</div></div>
        <div class="jcard"><div class="jv">${state.totalQuestsDone||0}</div><div class="jl">${t('jTotal')}</div></div>
        <div class="jcard"><div class="jv">${state.bestStreak||0}</div><div class="jl">${t('jBest')}</div></div>
        <div class="jcard"><div class="jv">${Object.keys(state.activeDays||{}).length}</div><div class="jl">${t('jActive')}</div></div>
        <div class="jcard"><div class="jv" style="color:${lockDay>0?'var(--gold)':'var(--muted)'};">${lockDay>0?lockDay:'−'}</div><div class="jl">${t('jLockIn')}</div></div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">${t('achievements')}</div>
      <div class="section-sub">Розблоковуються коли досягаєш потрібного рівня</div>
      <div class="achs">${ACHS.map(achCardH).join('')}</div>
    </section>

    <section class="section">
      <div class="section-title">${t('activity')}</div>
      <div class="section-sub">Всі твої дії записуються тут</div>
      <div class="log">${state.log.length?state.log.map(l=>`<div class="logitem"><span>${l.text}</span><span class="lt">${l.time}</span></div>`).join(''):`<div style="color:var(--muted);font-size:.82rem;padding:8px;">${t('noActivity')}</div>`}</div>
    </section>

    <section class="section">
      <div class="section-title">${t('settingsTitle')}</div>
      <div class="settings-row">
        <label>${t('langLabel')}</label>
        <select onchange="setLang(this.value)">
          <option value="uk" ${state.lang==='uk'?'selected':''}>🇺🇦 Українська</option>
          <option value="en" ${state.lang==='en'?'selected':''}>🇬🇧 English</option>
          <option value="ru" ${state.lang==='ru'?'selected':''}>🇷🇺 Русский</option>
          <option value="es" ${state.lang==='es'?'selected':''}>🇪🇸 Español</option>
          <option value="de" ${state.lang==='de'?'selected':''}>🇩🇪 Deutsch</option>
        </select>
        <div class="btn-row">
          <button class="btn-outline" onclick="backup()">💾 ${t('backup')}</button>
          <button class="btn-outline" onclick="restore()">📂 ${t('restore')}</button>
        </div>
      </div>
    </section>
  `;
}

/* ── MAIN RENDER ── */
function render(){
  const bs=state.businessStats||{};

  // Header
  document.getElementById('appHeader').innerHTML=`
    <div class="app-brand">
      <div class="logo">⚡</div>
      <div class="app-name">Level Up Life</div>
    </div>
    <div class="header-right">
      <button id="muteBtn" class="mute-btn" onclick="toggleMute()">${soundEnabled?'🔊':'🔇'}</button>
      <div class="level-pill">${t('level')} ${state.level}</div>
      <div class="coins-pill">🪙 ${state.coins}</div>
    </div>`;

  // Content
  const tabs={home:renderHome,quests:renderQuests,business:renderBusiness,shop:renderShop,profile:renderProfile};
  document.getElementById('app').innerHTML=(tabs[currentTab]||renderHome)();

  // Bottom nav
  const navItems=[
    {id:'home',icon:'🏠',label:t('tabHome')},
    {id:'quests',icon:'⚔️',label:t('tabQuests')},
    {id:'business',icon:'💼',label:t('tabBiz')},
    {id:'shop',icon:'🛒',label:t('tabShop')},
    {id:'profile',icon:'👤',label:t('tabProfile')}
  ];
  document.getElementById('bottomNav').innerHTML=navItems.map(n=>`
    <button class="nav-btn ${currentTab===n.id?'active':''}" onclick="switchTab('${n.id}')">
      <span class="ni">${n.icon}</span>
      <span>${n.label}</span>
    </button>`).join('');

  // Coach text
  const cs=document.getElementById('coachSpeech');if(cs)cs.textContent=defaultCoachMsg();

  // Enter keys
  ['qName','rName'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter'){id==='qName'?addQuest():addReward();}});
  });
  const ri=document.getElementById('revInput');
  if(ri)ri.addEventListener('keydown',e=>{if(e.key==='Enter')logRevenue();});
}

/* ── INIT ── */
normalize();
document.documentElement.lang=state.lang;
dailyReset();
const _s=streak();if(_s>(state.bestStreak||0))state.bestStreak=_s;
save();
if(!localStorage.getItem('onboardingDone')){showOnboarding();}else{render();}
</script>
</body>
</html>
